# Stage 3 smoke: a few mixed <answer> / <full> / <terse> steps from the Stage 2 checkpoint.
# Run: uv run scripts/train.py --config configs/smoke.yaml --init-from runs/20261125-163535/ckpt-600.pt
# Model shape (chunk_size, k, adapters, control vectors) must match Stage 2 so the checkpoint loads.
# Needs network once (sandbox off) to cache XSum/SQuAD; see docs/memory/hf-weights-and-sandbox.md.
model_name: HuggingFaceTB/SmolLM2-135M
device: cpu
chunk_size: 128
k: 16
dataset_config: wikitext-2-raw-v1
train_samples: 40
val_samples: 8
lr: 0.0003
encoder_lr_scale: 0.33
# 50% <answer>; the rest split evenly <full> (half 1-chunk, half whole-article) / <terse>
answer_ratio: 0.5
full_ratio: 0.5
multi_full_ratio: 0.5
terse_train_samples: 8
terse_val_samples: 2
qa_train_samples: 8
qa_val_samples: 2
decoder_lora: true
decoder_memory_adapter_rank: 8
control_vectors: true
steps: 5
batch_size: 2
grad_accum: 1
warmup_steps: 1
val_interval: 5
ckpt_interval: 5
