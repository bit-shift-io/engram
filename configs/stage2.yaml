# Stage 2: mixed <full> (WikiText) / <terse> (XSum) from a Stage 1 checkpoint.
# Run: uv run scripts/train.py --config configs/stage2.yaml --init-from runs/<stage1>/ckpt-3000.pt
# ~18 s/step (est. from 15.5 s at 25% article <full>) x 600 ~ 3 h.
# Keeps Stage 1's memory adapter (rank 8). The decoder LoRA is on (summarising is a new skill)
# but at a low LR (3e-4): at full LR it learned to ignore memory in Stage 1. Encoder side +
# adapter train at 3e-4 x 0.33 ~ 1e-4 so Stage 1's memory isn't overwritten.
# Budget at ~0.95 s per 128-token chunk fwd+bwd (Intel CPU):
#   <full> micro-batch  = 4 chunks              ~  3.8 s
#   <terse> micro-batch = 4 articles x <=4 chunks ~ 15.2 s worst case (summary decode is short)
#   full_ratio 0.5 -> ~9.5 s per micro-batch, x grad_accum 2 = ~19 s per step
#   500 steps x 19 s ~ 2.6 h, + 5 val passes (64 chunks + 32 articles ~ 1.5 min each) ~ 8 min
#   ~2.8 h worst case, under the 4 h limit.
model_name: HuggingFaceTB/SmolLM2-135M
device: cpu
chunk_size: 128
k: 16
seed: 0
run_dir: runs
dataset: wikitext
dataset_config: wikitext-103-raw-v1
train_samples: 6400
val_samples: 64
lr: 0.0003
encoder_lr_scale: 0.33
full_ratio: 0.6
# Mix: 20% 1-chunk <full>, 40% whole-article <full>, 40% <terse>, so articles don't come to mean
# 'summarise'. Two thirds of the <full> micro-batches rebuild a whole XSum article (up to 4 chunks = 64 memory vectors).
# Without this, <full> only ever sees 1-chunk memory and stops after ~26 tokens on articles, which
# breaks the <terse>/<full> length comparison. Multi-chunk micro-batch ~20 s (est.).
multi_full_ratio: 0.67
terse_dataset: EdinburghNLP/xsum
terse_train_samples: 2000
terse_val_samples: 32
max_chunks: 4
max_summary_tokens: 64
steps: 600
batch_size: 4
grad_accum: 2
warmup_steps: 20
val_interval: 100
ckpt_interval: 100
decoder_lora: true
decoder_memory_adapter_rank: 8
# Density flag as a learned vector in every decoder layer at control + target positions; a single
# <full> token was ignored on articles (it wrote a one-line summary and stopped).
control_vectors: true
