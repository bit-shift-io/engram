# Text-QA control: frozen SmolLM2 + one LoRA trained on `paragraph\nQuestion: q\nAnswer:` -> answer.
# Run: uv run scripts/train_text_qa.py --config configs/text_qa.yaml
# Fairness vs Stage 3 (configs/stage3.yaml, slice 04): same lora_r/alpha/targets, lr 3e-4 (the
# decoder LoRA LR), batch_size and grad_accum, and
#   text_qa_steps = answer_ratio * steps   (of the Stage 3 config)
# so the control sees as many QA examples as Stage 3's <answer> share.
model_name: HuggingFaceTB/SmolLM2-135M
device: cpu
chunk_size: 128
max_chunks: 4
lora_r: 8
lora_alpha: 16
lr: 0.0003
batch_size: 4
grad_accum: 2
warmup_steps: 20
# = answer_ratio 0.5 x 640 steps of configs/stage3.yaml
text_qa_steps: 320
qa_train_samples: 3200
qa_eval_samples: 200
text_qa_result: runs/text_qa_control.json
