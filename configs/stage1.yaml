# Budget: ~0.95-1.2 s per 128-token chunk fwd+bwd (Intel CPU; frozen-decoder runs measured ~0.85 s).
# 800 steps x 8 chunks = 6400 chunks ~ 1.7-2.1 h, + 8 val passes x 64 chunks (~0.4 s each) ~ 4 min.
# ~2.5 h worst case, leaving headroom for load under the 4 h limit.
# decoder_lora: false -- with a decoder LoRA the decoder memorises chunks / learns a constant
# soft prompt and ignores memory (64-chunk run: train acc real 0.637 vs shuffled 0.631).
# Frozen decoder: the only way to beat the LM prior is through memory.
model_name: HuggingFaceTB/SmolLM2-135M
device: cpu
chunk_size: 128
k: 16
seed: 0
run_dir: runs
dataset: wikitext
dataset_config: wikitext-103-raw-v1
train_samples: 6400
val_samples: 64
lr: 0.002
steps: 800
batch_size: 4
grad_accum: 2
val_interval: 100
ckpt_interval: 200
decoder_lora: false
