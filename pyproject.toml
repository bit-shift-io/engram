[project]
name = "engram"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.2.2",
    "numpy<2",
    "transformers>=4.44,<4.47",
    "peft>=0.12,<0.14",
    "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engram"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: loads real model weights; deselect with -m 'not slow'"]
